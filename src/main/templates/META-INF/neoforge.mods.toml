license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="ChinaEX123"
description='''
Add more upgrades to Functional Storage.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="titanium"
    type="required"
    versionRange="[4.0.8,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="functionalstorage"
    type="required"
    versionRange="[1.6.1,)"
    ordering="AFTER"
    side="BOTH"
